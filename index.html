<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maycon Maia — Creative Copywriter</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080706;
            --surface-color: #12100e;
            --text-primary: #f5f2eb;
            --text-secondary: #8c857b;
            --orange-primary: #d9531e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        /* Header Minimalista */
        header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 30px;
        }

        header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        header p {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--orange-primary);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .section-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        /* Prateleira / Grid de Capas na Home (10 Trabalhos) */
        .shelf-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }

        @media (min-width: 640px) {
            .shelf-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 50px 30px;
            }
        }

        @media (min-width: 1024px) {
            .shelf-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 50px 30px;
            }
        }

        .album-card {
            background: transparent;
            border: none;
            cursor: pointer;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .sleeve-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #141210;
            border-radius: 6px;
            overflow: visible;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }

        .vinyl-disc {
            position: absolute;
            top: 4%;
            right: 0%;
            width: 92%;
            height: 92%;
            background: radial-gradient(circle, #0a0a0c 0%, #1a1a1e 35%, #050507 36%, #111 65%, #000 100%);
            border-radius: 50%;
            z-index: 1;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .vinyl-disc::before {
            content: '';
            position: absolute;
            inset: 15%;
            border-radius: 50%;
            border: 1px dashed rgba(255,255,255,0.05);
        }

        .vinyl-label {
            width: 38%;
            height: 38%;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #d9531e 0%, #702004 100%);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.3);
        }

        .album-jacket {
            position: absolute;
            inset: 0;
            background: #141210;
            border-radius: 6px;
            z-index: 3;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .retro-stripes {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 8px;
            display: flex;
        }
        .retro-stripes span { flex: 1; height: 100%; }

        .album-card:hover .vinyl-disc {
            transform: translateX(25px) rotate(15deg);
        }

        .jacket-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .track-number {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .jacket-body h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.15;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .jacket-body p {
            font-size: 0.75rem;
            font-family: 'Space Mono', monospace;
            color: var(--orange-primary);
        }

        .album-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .album-title {
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .album-subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        /* ==========================================
           TELA DO PROJETO: LAYOUT DIVIDIDO MODULAR
           ========================================== */
        #project-view {
            display: none;
            width: 100%;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .project-nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 20px;
        }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-primary);
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .project-split-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
            align-items: start;
        }

        @media (min-width: 900px) {
            .project-split-layout {
                grid-template-columns: 320px 1fr;
                gap: 50px;
            }
        }

        .project-vinyl-showcase {
            position: relative;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .giant-sleeve {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #141210;
            border-radius: 6px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: visible;
        }

        .giant-vinyl-out {
            position: absolute;
            top: 4%;
            right: -38%;
            width: 92%;
            height: 92%;
            background: radial-gradient(circle, #0a0a0c 0%, #1a1a1e 35%, #050507 36%, #111 65%, #000 100%);
            border-radius: 50%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.12);
        }

        .giant-label {
            width: 40%;
            height: 40%;
            border-radius: 50%;
            background: linear-gradient(135deg, #d9531e 0%, #702004 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
            border: 3px solid rgba(255,255,255,0.3);
        }

        .vinyl-meta-info {
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Pôster Editorial */
        .editorial-poster {
            background: #a8201a;
            color: #12100e;
            border-radius: 6px;
            padding: 35px 25px;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            border: 2px solid rgba(0,0,0,0.4);
            background-image: radial-gradient(rgba(0,0,0,0.15) 1px, transparent 0);
            background-size: 16px 16px;
        }

        .poster-top-meta {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 1px solid rgba(18,16,14,0.3);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .poster-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 800;
            text-transform: uppercase;
            line-height: 0.95;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .poster-subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 25px;
            opacity: 0.85;
        }

        /* Bloco de Contexto (Lorem Ipsum / Sobre o Trabalho) */
        .poster-context-box {
            background: rgba(18, 16, 14, 0.85);
            color: #f5f2eb;
            padding: 22px;
            border-radius: 4px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            line-height: 1.6;
            font-family: 'DM Sans', sans-serif;
            border-left: 3px solid var(--orange-primary);
        }

        .poster-context-box strong {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--orange-primary);
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        /* BLOCOS MODULARES DE MÍDIA */
        .modular-section {
            margin-bottom: 25px;
        }

        /* 1. TV RETRÔ (Vídeo) */
        .retro-tv-container {
            background: #1a1714;
            border: 5px solid #2d2621;
            border-radius: 8px;
            padding: 10px;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.9), 0 10px 20px rgba(0,0,0,0.6);
        }

        .tv-screen {
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #080706;
        }

        .tv-screen::after {
            content: " ";
            display: block;
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 14, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .tv-placeholder-text {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: #d9531e;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            padding: 15px;
        }

        .tv-controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding: 0 2px;
        }

        .tv-brand {
            font-family: 'Syne', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: #8c857b;
            text-transform: uppercase;
        }

        /* 2. ARTES GRÁFICAS (Banners e Outdoors) */
        .graphics-gallery {
            background: #141210;
            border: 2px solid #332d28;
            border-radius: 8px;
            padding: 16px;
            color: #f5f2eb;
        }

        .graphics-title {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: #e09f3e;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .graphics-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media(min-width: 600px) {
            .graphics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .graphic-item {
            background: #1c1815;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: #8c857b;
            padding: 10px;
            text-transform: uppercase;
        }

        /* 3. TOCA-FITAS (Jingles e Áudio) */
        .cassette-player-container {
            background: #221e1a;
            border: 4px solid #3d342d;
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.6);
            color: #f5f2eb;
        }

        .cassette-label-top {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: #e09f3e;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .cassette-body {
            background: #141210;
            border-radius: 4px;
            border: 2px solid #332d28;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .cassette-window {
            width: 100%;
            background: #080706;
            border: 2px solid #2d2621;
            border-radius: 4px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 15px;
        }

        .tape-spool {
            width: 22px;
            height: 22px;
            border: 3px dashed #8c857b;
            border-radius: 50%;
            animation: spinTape 4s linear infinite;
        }

        @keyframes spinTape {
            100% { transform: rotate(360deg); }
        }

        .cassette-audio-controls {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
        }

        .play-audio-btn {
            background: #d9531e;
            color: #fff;
            border: none;
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 3px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .play-audio-btn:hover {
            background: #b3390c;
        }

        /* 4. CÓPIA / ROTEIRO ORIGINAL */
        .poster-copy-box {
            background: rgba(18, 16, 14, 0.92);
            color: #f5f2eb;
            padding: 24px;
            border-radius: 4px;
            border-left: 4px solid #12100e;
        }

        .poster-copy-box h3 {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--orange-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .poster-copy-text {
            font-size: 0.9rem;
            line-height: 1.7;
            white-space: pre-line;
            font-family: 'DM Sans', sans-serif;
        }

        footer {
            margin-top: 80px;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 30px;
            width: 100%;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>Maycon Maia</h1>
            <p>Creative Copywriter</p>
        </header>

        <!-- HOME: Prateleira de LPs (10 Trabalhos) -->
        <div id="home-view">
            <div class="section-label">Prateleira de LPs &bull; Selecione um trabalho (1 a 10)</div>
            <div class="shelf-grid" id="shelf-container"></div>
        </div>

        <!-- TELA DO PROJETO: LAYOUT DINÂMICO MODULAR -->
        <div id="project-view">
            <div class="project-
