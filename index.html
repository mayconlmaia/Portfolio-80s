<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maycon Maia — Creative Copywriter</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0908;
            --surface-color: #15120f;
            --text-primary: #f5f2eb;
            --text-secondary: #9c9285;
            --accent-orange: #d9531e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 15%, rgba(217, 83, 30, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 85%, rgba(112, 32, 4, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8));
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 30px;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 2px;
            background: var(--accent-orange);
        }

        header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        header p {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent-orange);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .section-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .shelf-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 45px;
        }

        @media (min-width: 768px) {
            .shelf-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 55px 45px;
            }
        }

        .album-card {
            background: transparent;
            border: none;
            cursor: pointer;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .sleeve-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #141210;
            border-radius: 8px;
            overflow: visible;
            box-shadow: 0 20px 40px rgba(0,0,0,0.75);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .vinyl-disc {
            position: absolute;
            top: 4%;
            right: 0%;
            width: 92%;
            height: 92%;
            background: radial-gradient(circle, #08080a 0%, #1c1c21 35%, #050507 36%, #121215 65%, #000 100%);
            border-radius: 50%;
            z-index: 1;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .vinyl-disc::before {
            content: '';
            position: absolute;
            inset: 15%;
            border-radius: 50%;
            border: 1px dashed rgba(255,255,255,0.08);
        }

        .vinyl-label {
            width: 38%;
            height: 38%;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.3);
            background: var(--accent-orange);
        }

        .album-jacket {
            position: absolute;
            inset: 0;
            background: #141210;
            border-radius: 8px;
            z-index: 3;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .album-jacket img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .jacket-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.15) 60%);
            z-index: 2;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .album-card:hover .vinyl-disc {
            transform: translateX(45px) rotate(22deg);
        }

        .track-number {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: #fff;
            opacity: 0.9;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .jacket-body h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.15;
            margin-bottom: 4px;
            text-transform: uppercase;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }

        .album-meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-left: 2px;
        }

        .album-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .album-subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        #project-view {
            display: none;
            width: 100%;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .project-nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 20px;
        }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-primary);
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .project-desktop-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 35px;
            align-items: start;
        }

        @media (min-width: 900px) {
            .project-desktop-layout {
                grid-template-columns: 320px 1fr;
                gap: 45px;
            }
        }

        .project-vinyl-showcase {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .giant-sleeve {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #141210;
            border-radius: 8px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.12);
            overflow: visible;
        }

        .giant-sleeve img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            z-index: 2;
        }

        .giant-vinyl-out {
            position: absolute;
            top: 4%;
            right: -38%;
            width: 92%;
            height: 92%;
            background: radial-gradient(circle, #08080a 0%, #1c1c21 35%, #050507 36%, #121215 65%, #000 100%);
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.15);
            z-index: 1;
        }

        .giant-label {
            width: 40%;
            height: 40%;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.7);
            border: 3px solid rgba(255,255,255,0.3);
            transition: background-color 0.5s ease;
        }

        .editorial-poster {
            color: #12100e;
            border-radius: 8px;
            padding: 35px 25px;
            position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.85);
            border: 2px solid rgba(0,0,0,0.5);
            background-image: radial-gradient(rgba(0,0,0,0.15) 1px, transparent 0);
            background-size: 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            transition: background-color 0.5s ease;
        }

        .poster-top-meta {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .poster-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 800;
            text-transform: uppercase;
            line-height: 0.95;
            letter-spacing: -1px;
        }

        .poster-subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.85;
            margin-top: -8px;
        }

        .poster-context-box {
            background: rgba(18, 16, 14, 0.94);
            color: var(--text-primary);
            padding: 22px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.6;
            font-family: 'DM Sans', sans-serif;
            border-left: 4px solid #12100e;
        }

        .poster-context-box strong {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
            letter-spacing: 1px;
            color: var(--accent-orange);
        }

        .tv-cabinet {
            background: #221c17;
            border: 6px solid #14100c;
            border-radius: 12px;
            padding: 18px 18px 12px 18px;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.9), 0 15px 25px rgba(0,0,0,0.7);
            position: relative;
        }

        .tv-antenna {
            position: absolute; top: -20px; left: 18%; width: 2px; height: 25px; background: #666; transform: rotate(-25deg);
        }
        .tv-antenna::after {
            content: ''; position: absolute; top: -20px; right: -35px; width: 2px; height: 25px; background: #666; transform: rotate(50deg);
        }

        .tv-screen-curved {
            background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 4 / 3;
            position: relative; display: flex; align-items: center; justify-content: center; border: 3px solid #080605;
        }

        .tv-screen-curved::before {
            content: " "; display: block; position: absolute; inset: 0;
            background: linear-gradient(rgba(18, 16, 14, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 10; background-size: 100% 4px, 4px 100%; pointer-events: none;
        }

        .tv-video-text {
            font-family: 'Space Mono', monospace; font-size: 0.7rem; color: #fff;
            text-transform: uppercase; letter-spacing: 2px; text-align: center; padding: 15px;
        }

        .tv-bottom-panel { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .tv-knobs { display: flex; gap: 6px; }
        .knob { width: 12px; height: 12px; background: #111; border-radius: 50%; border: 2px solid #555; }

        .cassette-deck-box {
            background: #181513; border: 4px solid #28211c; border-radius: 8px; padding: 16px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.9), 0 12px 20px rgba(0,0,0,0.6); color: #fff;
        }

        .cassette-visual-real {
            background: #0e0d0c; border: 2px solid #332b25; border-radius: 6px; padding: 12px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .cassette-window-dual {
            width: 100%; background: #050404; border: 2px solid #221c17; border-radius: 4px;
            height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
        }

        .real-spool {
            width: 24px; height: 24px; border: 4px dashed #bbb; border-radius: 50%; background: #111;
            animation: spinTape 3s linear infinite;
        }

        @keyframes spinTape { 100% { transform: rotate(360deg); } }

        .cassette-play-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .cassette-btn-action {
            color: #fff; border: none; font-family: 'Space Mono', monospace; font-size: 0.65rem; font-weight: bold;
            padding: 5px 12px; border-radius: 3px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; background: var(--accent-orange);
            transition: opacity 0.2s;
        }
        .cassette-btn-action:hover { opacity: 0.85; }

        .graphics-gallery {
            background: #141210; border: 2px solid #332d28; border-radius: 8px; padding: 16px; color: var(--text-primary);
        }
        .graphics-title {
            font-family: 'Space Mono', monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; color: var(--accent-orange);
        }
        .graphics-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media(min-width: 600px) { .graphics-grid { grid-template-columns: repeat(2, 1fr); } }
        .graphic-item {
            background: #1c1815; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; height: 120px;
            display: flex; align-items: center; justify-content: center; text-align: center;
            font-family: 'Space Mono', monospace; font-size: 0.6rem; color: #ccc; padding: 10px; text-transform: uppercase;
        }

        .poster-copy-box {
            background: rgba(18, 16, 14, 0.95); color: var(--text-primary); padding: 24px; border-radius: 6px; border-left: 4px solid #12100e;
        }
        .poster-copy-box h3 {
            font-family: 'Space Mono', monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
        }
        .poster-copy-text { font-size: 0.9rem; line-height: 1.7; white-space: pre-line; font-family: 'DM Sans', sans-serif; }

        footer {
            margin-top: 70px; text-align: center; font-family: 'Space Mono', monospace; font-size: 0.65rem;
            color: var(--text-secondary); letter-spacing: 2px; border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 25px; width: 100%; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Maycon Maia</h1>
            <p>Creative Copywriter</p>
        </header>

        <div id="home-view">
            <div class="section-label">Prateleira de LPs &bull; Trabalhos em Destaque</div>
            <div class="shelf-grid" id="shelf-container"></div>
        </div>

        <div id="project-view">
            <div class="project-nav-bar">
                <button class="back-btn" onclick="goHome()">← Voltar à Prateleira</button>
                <span style="font-family: 'Space Mono', monospace; font-size: 0.75rem; color: var(--text-secondary);" id="project-code-label">Faixa 01 &bull; Stereo</span>
            </div>
            
            <div class="project-desktop-layout">
                <div class="project-vinyl-showcase">
                    <div class="giant-sleeve">
                        <img id="giant-sleeve-img" src="" alt="Capa do Álbum">
                        <div class="giant-vinyl-out">
                            <div class="giant-label" id="giant-label-text">LADO A<br><small>01</small></div>
                        </div>
                    </div>
                    <div style="font-family:'Space Mono'; font-size:0.65rem; color:var(--text-secondary); text-align:center; letter-spacing:2px; text-transform:uppercase;">Prensagem Original • 2026</div>
                </div>

                <div class="editorial-poster" id="editorial-poster-box">
                    <div class="poster-top-meta">
                        <span id="poster-location-date">SÃO PAULO &bull; CAMPANHA</span>
                        <span>MAYCON MAIA CO.</span>
                    </div>

                    <h2 class="poster-title" id="poster-title-text
